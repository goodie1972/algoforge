<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>图标对比</title>
<style>
  body { background: #1a1d23; color: #e0e0e0; font-family: system-ui; padding: 40px; }
  .row { display: flex; gap: 60px; margin-bottom: 40px; align-items: center; }
  .icon-box { text-align: center; }
  .icon-box svg { width: 48px; height: 48px; fill: currentColor; }
  .icon-box .label { margin-top: 8px; font-size: 12px; color: #888; }
  .title { color: #f0b90b; font-size: 18px; margin-bottom: 20px; }
  .note { color: #888; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>

<div class="title">你给的 (GitHub Octicons chevron-up-down)</div>
<div class="row">
  <div class="icon-box">
    <svg width="48" height="48" viewBox="0 0 16 16">
      <path fill="currentColor" d="M4.22 6.53a.75.75 0 0 0 1.06 0L8 3.81l2.72 2.72a.75.75 0 1 0 1.06-1.06L8.53 2.22a.75.75 0 0 0-1.06 0L4.22 5.47a.75.75 0 0 0 0 1.06Zm0 2.94a.75.75 0 0 1 1.06 0L8 12.19l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0l-3.25-3.25a.75.75 0 0 1 0-1.06Z"/>
    </svg>
    <div class="label">圆角 chevron</div>
  </div>
</div>

<div class="title">Tabler Icons</div>
<div class="row">
  <div class="icon-box">
    <svg width="48" height="48" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
      <path d="M8 9l4 -4l4 4" />
      <path d="M16 15l-4 4l-4 -4" />
    </svg>
    <div class="label">IconSelector<br>（尖角 V 形）</div>
  </div>
  <div class="icon-box">
    <svg width="48" height="48" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
      <path d="M18 10l-6 -6l-6 6h12" />
      <path d="M18 14l-6 6l-6 -6h12" />
    </svg>
    <div class="label">IconCaretUpDown<br>（三角实心）</div>
  </div>
  <div class="icon-box">
    <svg width="48" height="48" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
      <path d="M3 9l4 -4l4 4m-4 -4v14" />
      <path d="M21 15l-4 4l-4 -4m4 4v-14" />
    </svg>
    <div class="label">IconArrowsSort<br>（有杆连线）</div>
  </div>
</div>

<div class="title">Ionicons 5</div>
<div class="row">
  <div class="icon-box">
    <svg width="48" height="48" viewBox="0 0 512 512" fill="none" stroke="currentColor" stroke-width="32">
      <path d="M464 208L352 96L240 208"/>
      <path d="M352 113.13V416"/>
      <path d="M48 304l112 112l112-112"/>
      <path d="M160 398V96"/>
    </svg>
    <div class="label">SwapVerticalOutline<br>（有杆有连线）</div>
  </div>
</div>

</body>
</html>
